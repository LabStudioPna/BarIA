<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Página no encontrada | BarIA</title>
<meta name="description" content="Página no encontrada — BarIA">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="shortcut icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600,0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="tracker.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#8B5CF6;--brand-light:#A78BFA;--accent:#F5B841;
  --border:#E5DFF5;--text:#1E1729;--mid:#6E6280;--dim:#8F84A3;
  --heading:#7C3AED;
  --bg-page:#FAF8FC;--surface:#fff;--surface-2:#F1ECFB;
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Inter',system-ui,sans-serif;
}
[data-theme="dark"]{
  --border:rgba(255,255,255,.12);--text:#F0EEF8;--mid:#A79FC0;--dim:#8078A0;
  --heading:#C4B5FD;
  --bg-page:#120E1C;--surface:#1E1830;--surface-2:#1A1428;
}
body{font-family:var(--sans);color:var(--text);background:var(--bg-page);transition:background .2s,color .2s;min-height:100vh;display:flex;flex-direction:column}

header{border-bottom:1px solid var(--border);padding:0 24px}
.nav{max-width:800px;margin:0 auto;height:64px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--serif);font-weight:600;font-size:21px;color:var(--heading);text-decoration:none}
.logo em{font-style:italic;color:var(--accent)}
#theme-toggle{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}

.wrap404{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px;text-align:center}
.card404{max-width:440px}
.icon404{font-size:44px;margin-bottom:18px}
h1{font-family:var(--serif);font-size:64px;font-weight:700;color:var(--heading);margin-bottom:10px;letter-spacing:-.02em}
h1 em{font-style:italic;color:var(--accent)}
p{color:var(--mid);font-size:15px;margin-bottom:28px;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;text-decoration:none;padding:13px 24px;border-radius:11px;font-weight:600;font-size:14.5px}
.btn:hover{opacity:.92}

footer{border-top:1px solid var(--border);padding:24px;text-align:center;color:var(--dim);font-size:13px}
footer a{color:var(--brand-light);text-decoration:none}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a href="index.html" class="logo">Bar<em>IA</em></a>
    <button id="theme-toggle" onclick="toggleTheme()" title="Cambiar tema">🌙</button>
  </div>
</header>

<div class="wrap404">
  <div class="card404">
    <div class="icon404">🍸</div>
    <h1>4<em>0</em>4</h1>
    <p>Esta página se cayó de la bandeja. No está donde debería estar — probá volviendo al inicio.</p>
    <a href="index.html" class="btn">Volver a BarIA →</a>
  </div>
</div>

<footer>
  <p>BarIA — Desarrollado por <a href="https://labstudiopna.github.io" target="_blank">LABStudio.pna</a> · Paraná, Entre Ríos, Argentina</p>
</footer>

<script>
  (function() {
    const savedTheme = localStorage.getItem('baria_theme') || 'light';
    if (savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  })();
  function applyTheme(theme) {
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    localStorage.setItem('baria_theme', next);
    applyTheme(next);
  }
  document.addEventListener('DOMContentLoaded', () => {
    applyTheme(localStorage.getItem('baria_theme') || 'light');
  });
</script>

</body>
</html>
